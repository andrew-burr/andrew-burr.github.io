<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio | Andrew Burrow</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#172231;background:#f8f9fb;line-height:1.6}header{background:#172231;color:white} .wrap{max-width:1100px;margin:auto;padding:0 24px}nav{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:20px 0;border-bottom:1px solid #435060}nav a{color:white;text-decoration:none}nav div{display:flex;gap:22px}.hero{padding:42px 0}h1{font-size:32px;margin:0 0 8px}p{margin:8px 0}.subtitle{color:#c9d9ed}main{padding:28px 0 48px}h2{font-size:22px;margin:0 0 18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.tile{display:block;border:1px solid #d9dde3;background:white;border-radius:9px;padding:20px;text-decoration:none;color:inherit;transition:background .15s,border-color .15s}.tile:hover{background:#eef3fa;border-color:#8196b2}.tile:focus-visible,a:focus-visible{outline:3px solid #6a9de1;outline-offset:3px}.tile svg{width:27px;height:27px;fill:none;stroke:#586372;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.tile h3{font-size:18px;margin:8px 0 4px}.tile p{font-size:14px;color:#526071}.link{font-size:13px;color:#34577e}.detail{background:white;border:1px solid #d9dde3;border-radius:9px;padding:28px}.detail a{color:#34577e}footer{border-top:1px solid #d9dde3;padding:20px 0;color:#586372;font-size:14px}footer a{color:inherit} @media(max-width:620px){.grid{grid-template-columns:1fr}h1{font-size:26px}.wrap{padding:0 18px}nav div{gap:14px}}
</style>
</head>
<body>
<header><div class="wrap"><nav><a href="#home"><strong>Professional Portfolio</strong></a><div><a href="#home">Home</a><a href="#projects">Projects</a><a href="#resume">Résumé</a></div></nav><div class="hero"><h1>Professional Portfolio</h1><p class="subtitle">Operations | Management | Information Technology | Cybersecurity</p><p>A collection of my projects, professional experience, and certifications.</p></div></div></header>
<main class="wrap"><section id="home"><h2>Areas of expertise</h2><div class="grid" id="cards"></div></section><section id="detail" class="detail" hidden><a href="#home">← Back to portfolio</a><h2 id="detail-title" style="margin-top:18px"></h2><p id="detail-description"></p><p id="detail-status"></p></section></main>
<footer><div class="wrap"><a href="https://github.com/andrew-burr">GitHub</a> · Professional Portfolio</div></footer>
<script>
const categories=[
['warehouse','Warehouse & Operations','Inventory, logistics and process improvement','<path d="M3 9l9-6 9 6v12H3z M7 12h10v9H7z M7 16h10"/>'],
['leadership','Leadership & Management','Training, supervision and planning','<circle cx="9" cy="7" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3 M16 4a3 3 0 0 1 0 6 M17 13a5 5 0 0 1 4 5v3"/>'],
['it','Information Technology','Systems, networking and troubleshooting','<rect x="3" y="3" width="18" height="13" rx="2"/><path d="M12 16v5 M8 21h8"/>'],
['cybersecurity','Cybersecurity','Security analysis, labs and assessments','<path d="M12 3l8 3v6c0 5-8 9-8 9s-8-4-8-9V6z M9 12l2 2 4-5"/>'],
['analytics','Data & Analytics','Excel, dashboards and reporting','<path d="M3 21v-6 M8 21V10 M13 21v-8 M18 21V5 M3 10l5-5 5 3 7-6"/>'],
['education','Education & Certifications','Degrees and professional credentials','<path d="M2 9l10-5 10 5-10 5z M6 11v6c4 3 8 3 12 0v-6 M22 9v7"/>']];
const cards=document.getElementById('cards');
for(const [id,title,description,icon] of categories){const a=document.createElement('a');a.className='tile';a.href='#'+id;a.innerHTML=`<svg viewBox="0 0 24 24" aria-hidden="true">${icon}</svg><h3>${title}</h3><p>${description}</p><span class="link">${id==='education'?'View credentials':'View projects'}</span>`;cards.append(a)}
function route(){const id=location.hash.slice(1);const item=categories.find(c=>c[0]===id);const resume=id==='resume';document.getElementById('home').hidden=!!item||resume;document.getElementById('detail').hidden=!(item||resume);if(item||resume){document.getElementById('detail-title').textContent=resume?'Résumé':item[1];document.getElementById('detail-description').textContent=resume?'Professional experience, education and skills.':item[2];document.getElementById('detail-status').textContent=resume?'Résumé not yet published.':item[0]==='education'?'Credentials not yet published.':'Projects not yet published.';}}
window.addEventListener('hashchange',route);route();
</script></body></html>
