<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Andrew Burrow's professional portfolio."><title>Portfolio | Andrew Burrow</title><style>
:root{color-scheme:light;--ink:#252830;--muted:#626773;--line:rgba(66,75,94,.13)}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:radial-gradient(ellipse at 12% 15%,#f9fafc 0,transparent 48%),radial-gradient(ellipse at 90% 70%,#dce0e7 0,transparent 55%),#e9ebef;line-height:1.55}a{color:inherit;text-decoration:none}button{font:inherit}a:focus-visible{outline:3px solid #67758e;outline-offset:5px}.shell{max-width:1120px;margin:auto;padding:0 48px;min-height:100vh;display:flex;flex-direction:column}header{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:32px 0;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:13px;font-size:15px;font-weight:600;letter-spacing:-.02em}.mark{display:grid;place-items:center;width:42px;height:42px;background:#292c33;color:white;border-radius:12px;font-size:14px;letter-spacing:-.07em;box-shadow:0 5px 12px #24283220}main{flex:1}.intro{padding:70px 0 38px}h1{font-size:clamp(36px,5.4vw,64px);line-height:1.08;letter-spacing:-.065em;margin:0 0 17px;font-weight:650}.intro p,.section p{font-size:16px;color:var(--muted);margin:0;max-width:600px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;padding-bottom:30px}.card{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:218px;padding:28px 30px;border:1px solid rgba(255,255,255,.95);border-radius:24px;background:linear-gradient(135deg,rgba(255,255,255,.79),rgba(255,255,255,.46));backdrop-filter:blur(18px);box-shadow:0 2px 4px #262e4005,0 12px 32px #262e4009,inset 0 1px 0 white;transition:transform .25s cubic-bezier(.2,.75,.25,1),box-shadow .25s,background .25s;overflow:hidden}.card:hover{transform:translateY(-5px);box-shadow:0 18px 40px #262e401b,inset 0 1px 0 white;background:rgba(255,255,255,.85)}.card:active{transform:translateY(-1px)}.cardtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px}.glyph{width:38px;height:38px;color:#454c59;stroke-width:1.55}.arrow{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:#eef1f5;color:#464c58;transition:transform .25s,background .25s,box-shadow .25s}.arrow svg{width:16px;height:16px}.card:hover .arrow{transform:translateX(2px);background:#e3e7ed;box-shadow:0 8px 18px #262e4011}.card h2{font-size:21px;letter-spacing:-.04em;line-height:1.25;margin:0;font-weight:600}.section{padding:44px 0 65px;animation:appear .28s ease both}.back{display:inline-flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin-bottom:42px}.back:hover{color:var(--ink)}.section h1{font-size:clamp(32px,5vw,52px)}.section .glyph{margin-bottom:18px}.entries{display:grid;gap:16px;margin-top:35px}.entry{display:block;background:#ffffffa8;border:1px solid white;border-radius:18px;padding:25px;box-shadow:0 8px 24px #262e4009}.entry h2{font-size:21px;margin:0 0 8px}.entry p{font-size:14px}.empty{margin-top:36px;border-top:1px solid var(--line);padding-top:20px;font-size:14px;color:var(--muted)}[hidden]{display:none!important}@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}@media(max-width:650px){.shell{padding:0 22px}header{padding:22px 0}.intro{padding:48px 0 28px}.grid{grid-template-columns:1fr;gap:14px;padding-bottom:36px}.card{min-height:180px;padding:22px;border-radius:20px}.cardtop{margin-bottom:24px}.card h2{font-size:20px}footer{flex-wrap:wrap}.section{padding-top:30px}.back{margin-bottom:30px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body><svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true"><symbol id="education-icon" viewBox="0 0 24 24"><path d="m2 10 10-5 10 5-10 5zM6 12v5c4 3 8 3 12 0v-5M22 10v6"/></symbol><symbol id="warehouse-icon" viewBox="0 0 24 24"><path d="M3 21V7l9-4 9 4v14M3 21h18M7 21V11h10v10M7 15h10M7 18h10"/></symbol><symbol id="it-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="13" rx="2"/><path d="M12 16v5m-5 0h10"/></symbol><symbol id="cyber-icon" viewBox="0 0 24 24"><path d="m12 3 8 3v6c0 5-4 8-8 10-4-2-8-5-8-10V6zM8.5 12l2.5 2.5 4.5-5"/></symbol><symbol id="arrow-icon" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol></svg><div class="shell"><header><a class="brand" href="#home"><span class="mark">AB</span><span>Andrew Burrow</span></a></header><main id="main"><section id="home"><div class="intro"><h1>My Portfolio</h1><p>Hey, welcome to my portfolio! This is just some of the things I wanted to showcase.</p></div><div class="grid" id="cards"></div></section><section id="detail" class="section" hidden></section></main></div><script>
// Add real projects to the entries array for the relevant category.
// Each entry may have a title, description, and a link to a project page.
const categories=[
{id:'education',icon:'education',title:'Education & Certifications',description:'Academic and professional credentials',entries:[]},
{id:'warehouse',icon:'warehouse',title:'Warehouse & Operations',description:'Operational experience and management',entries:[]},
{id:'information-technology',icon:'it',title:'Information Technology',description:'Technical projects and troubleshooting',entries:[]},
{id:'cybersecurity',icon:'cyber',title:'Cybersecurity',description:'Security projects and research',entries:[]}
];
const svg=(id,cls='glyph')=>`<svg class="${cls}" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.65" aria-hidden="true"><use href="#${id}-icon"/></svg>`;
const cards=document.getElementById('cards');for(const c of categories){const a=document.createElement('a');a.className='card';a.href='#'+c.id;a.innerHTML=`<div class="cardtop">${svg(c.icon)}<span class="arrow">${svg('arrow','')}</span></div><div><h2></h2></div>`;a.querySelector('h2').textContent=c.title;cards.append(a)}
const home=document.getElementById('home'),detail=document.getElementById('detail');function render(){const c=categories.find(x=>'#'+x.id===location.hash);home.hidden=!!c;detail.hidden=!c;document.title=c?`${c.title} | Andrew Burrow`:'Portfolio | Andrew Burrow';if(c){detail.innerHTML=`<a class="back" href="#home">← &nbsp; Portfolio</a><div>${svg(c.icon)}</div><h1 tabindex="-1"></h1><p></p><div class="entries"></div>`;detail.querySelector('h1').textContent=c.title;detail.querySelector('p').textContent=c.description;const list=detail.querySelector('.entries');for(const e of c.entries){const el=document.createElement(e.link?'a':'article');el.className='entry';if(e.link)el.href=e.link;const h=document.createElement('h2'),p=document.createElement('p');h.textContent=e.title;p.textContent=e.description||'';el.append(h,p);list.append(el)}if(!c.entries.length){const p=document.createElement('p');p.className='empty';p.textContent='No entries published yet.';detail.append(p)}}window.scrollTo(0,0)}window.addEventListener('hashchange',()=>{render();const h=document.querySelector('section:not([hidden]) h1');if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true})}});render();
</script></body></html>
